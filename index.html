<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="UTF-8">
<script>/* обычные посетители сразу попадают на регистрацию/вход; старая страница с ключом: /?key */if(!/[?&]key\b/.test(location.search)&&!/access_token=/.test(location.hash))location.replace("/dash")</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Themes</title>
<style>
:root{--accent:#ff6b5e;--radius:12px;--pad:14px;--font:-apple-system,"SF Pro Display","Segoe UI",system-ui,sans-serif;--ease:cubic-bezier(.3,.8,.3,1)}
[data-theme=dark]{--bg:#0b0d12;--panel:rgba(30,34,44,.72);--panel2:rgba(255,255,255,.05);--line:rgba(255,255,255,.09);--text:#eef0f5;--mut:#8b91a0}
[data-theme=light]{--bg:#e9ecf2;--panel:rgba(255,255,255,.8);--panel2:rgba(0,0,0,.05);--line:rgba(0,0,0,.1);--text:#161922;--mut:#6b7180}
*{box-sizing:border-box;margin:0}
body{font-family:var(--font);font-size:17px;background:var(--bg);color:var(--text);min-height:100vh;display:grid;place-items:center;padding:20px;transition:background .5s,color .4s;
background-image:radial-gradient(60% 50% at 20% 10%,color-mix(in srgb,var(--accent) 22%,transparent),transparent),radial-gradient(50% 50% at 90% 90%,rgba(80,110,255,.14),transparent)}
button,select,input{font:inherit;color:inherit}
.hide{display:none!important}
.glass{background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);box-shadow:0 30px 80px rgba(0,0,0,.35)}
/* login */
#login,#bot,#req{width:min(380px,100%);padding:34px;border-radius:calc(var(--radius) + 8px);animation:rise .6s var(--ease)}
#login h1,#bot h1,#req h1{font-size:30px;margin-bottom:6px}
#login p,#bot p,#req p{color:var(--mut);margin-bottom:22px;font-size:17px}
.field{width:100%;padding:13px 14px;border-radius:var(--radius);background:var(--panel2);border:1px solid var(--line);outline:0;transition:border-color .25s,box-shadow .25s}
.field:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 28%,transparent)}
.btn{margin-top:14px;width:100%;padding:13px;border:0;border-radius:var(--radius);background:var(--accent);color:#fff;font-weight:600;cursor:pointer;transition:transform .2s var(--ease),filter .2s,box-shadow .3s;box-shadow:0 8px 28px color-mix(in srgb,var(--accent) 45%,transparent)}
.btn:hover{filter:brightness(1.08);transform:translateY(-1px)}.btn:active{transform:scale(.97)}
#err{color:#ff7a7a;font-size:15px;height:18px;margin-top:10px}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@keyframes rise{from{opacity:0;transform:translateY(16px) scale(.98)}}
/* app */
#app{width:min(980px,100%);display:grid;grid-template-columns:240px 1fr;border-radius:calc(var(--radius) + 8px);overflow:hidden;min-height:560px;animation:rise .6s var(--ease)}
nav{padding:18px 12px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:4px;position:relative}
nav button{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid transparent;border-radius:var(--radius);background:0;color:var(--mut);cursor:pointer;text-align:left;transition:all .25s var(--ease)}
nav button:hover{background:var(--panel2);color:var(--text);transform:translateX(3px)}
nav button.on{color:var(--text);border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent);box-shadow:0 0 18px color-mix(in srgb,var(--accent) 35%,transparent)}
nav .badge{margin-left:auto;font-size:13px;background:var(--panel2);padding:2px 7px;border-radius:99px}
nav .sp{flex:1}
#ping{font-size:14px;color:var(--mut);padding:8px 12px;display:flex;align-items:center;gap:8px}
#ping i{width:8px;height:8px;border-radius:50%;background:#888;transition:background .4s}
main{padding:26px 30px;position:relative}
.view{animation:rise .45s var(--ease)}
h2{font-size:30px}.sub{color:var(--mut);font-size:16px;margin:4px 0 20px}
.lbl{font-size:16px;margin:20px 0 10px}
/* segmented */
.seg{position:relative;display:flex;padding:4px;border-radius:99px;background:var(--panel2);border:1px solid var(--line);width:100%}
.seg button{flex:1;position:relative;z-index:1;padding:8px;border:0;background:0;cursor:pointer;border-radius:99px;transition:color .3s}
.seg .pill{position:absolute;top:4px;bottom:4px;border-radius:99px;background:var(--accent);box-shadow:0 0 18px color-mix(in srgb,var(--accent) 60%,transparent);transition:left .4s var(--ease),width .4s var(--ease)}
.seg button.on{color:#fff}
/* swatches */
.sw{display:flex;gap:14px;flex-wrap:wrap}
.sw button{width:28px;height:28px;border-radius:50%;border:2px solid transparent;cursor:pointer;background:var(--c);box-shadow:0 0 14px var(--c);transition:transform .3s var(--ease),border-color .3s}
.sw button:hover{transform:scale(1.18)}.sw button.on{transform:scale(1.3);border-color:#fff}
/* range */
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:5px;border-radius:9px;background:linear-gradient(90deg,var(--accent) var(--p,50%),var(--panel2) var(--p,50%));outline:0}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 0 12px var(--accent);transition:transform .2s}
input[type=range]::-webkit-slider-thumb:hover{transform:scale(1.25)}
.ticks{display:flex;justify-content:space-between;font-size:13px;color:var(--mut);margin-top:6px}
select.field{cursor:pointer}
html{color-scheme:dark}html[data-theme=light]{color-scheme:light}
select.field option{background:#1b1f29;color:#eef0f5}[data-theme=light] select.field option{background:#fff;color:#161922}
/* toggle */
.row{display:flex;align-items:center;gap:12px;margin-top:14px}
.row b{display:block;font-weight:600;font-size:17px}.row small{color:var(--mut);font-size:15px}
.tg{margin-left:0;flex:none;width:42px;height:24px;border-radius:99px;border:0;background:var(--panel2);position:relative;cursor:pointer;transition:background .3s}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .35s var(--ease)}
.tg.on{background:var(--accent)}.tg.on::after{transform:translateX(18px)}
.card{padding:var(--pad);border:1px solid var(--line);border-radius:var(--radius);background:var(--panel2);margin-top:12px;transition:border-color .3s,transform .3s var(--ease)}
.card:hover{border-color:var(--accent);transform:translateY(-2px)}
.li{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:var(--radius);border:1px solid var(--line);margin-top:8px;background:var(--panel2);transition:transform .25s var(--ease),border-color .25s}
.li:hover{transform:translateX(4px);border-color:var(--accent)}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:600;color:#fff;background:var(--accent);flex:none}
.dot{width:8px;height:8px;border-radius:50%;background:#888;margin-left:auto;flex:none}.dot.ok{background:#22c55e;box-shadow:0 0 8px #22c55e}
.li small,.card small{color:var(--mut);font-size:15px}
kbd{margin-left:auto;font:14px ui-monospace,Consolas,monospace;padding:3px 8px;border-radius:6px;background:var(--panel2);border:1px solid var(--line)}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.kv div{padding:10px 12px;border-radius:var(--radius);background:var(--panel2)}
.kv small{display:block}.kv b{font-size:17px;word-break:break-all}
.chip{display:inline-block;padding:3px 10px;border-radius:99px;font-size:14px;font-weight:600;background:#888;color:#fff}.chip.ok{background:#22c55e}.chip.off{background:#ef4444}
.btn.sm{width:auto;margin:0;padding:9px 16px}.btn.ghost{background:var(--panel2);box-shadow:none;color:var(--text);border:1px solid var(--line)}
pre{font:14px/1.5 ui-monospace,Consolas,monospace;padding:12px;border-radius:var(--radius);background:var(--panel2);overflow:auto;margin-top:12px}
.spin{animation:sp 1s linear infinite;display:inline-block}@keyframes sp{to{transform:rotate(360deg)}}
.pv{display:flex;gap:18px;align-items:center;padding:var(--pad);border:1px solid var(--line);border-radius:var(--radius);background:var(--panel2)}
.av{overflow:hidden;transition:transform .3s var(--ease)}.pv .av:hover{transform:scale(1.06)}
#intro{position:fixed;inset:0;z-index:50;display:grid;place-content:center;justify-items:center;gap:34px;background:var(--bg);overflow:hidden;transition:opacity .8s,visibility .8s}
#intro.out{opacity:0;visibility:hidden}
#wt{position:relative;font-size:clamp(34px,8vw,86px);font-weight:700;letter-spacing:-.02em;text-align:center;color:#fff;animation:glow 2.6s ease-in-out infinite alternate}
#wt span{display:inline-block;opacity:0;filter:blur(14px);transform:translateY(26px) scale(.9);animation:ch .9s var(--ease) forwards}
@keyframes ch{to{opacity:1;filter:none;transform:none}}
@keyframes glow{from{text-shadow:0 0 18px var(--accent),0 0 48px var(--accent)}to{text-shadow:0 0 28px var(--accent),0 0 70px var(--accent),0 0 140px var(--accent)}}
.blob{position:absolute;width:55vmax;height:55vmax;border-radius:50%;filter:blur(100px);opacity:.33;background:var(--accent);animation:fl 9s ease-in-out infinite alternate}
.b1{left:-18%;top:-25%}.b2{right:-18%;bottom:-30%;background:#4f6bff;animation-delay:-4s}
@keyframes fl{to{transform:translate(8vw,6vh) scale(1.2)}}
#ld{position:relative;width:min(340px,80vw);text-align:center;opacity:0;transition:opacity .6s}#ld.on{opacity:1}
.bar{height:6px;border-radius:9px;background:var(--panel2);overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--accent);box-shadow:0 0 12px var(--accent);transition:width .5s var(--ease)}
#ld small{display:block;margin-top:12px;color:var(--mut)}
#hold{position:relative;overflow:hidden;user-select:none;touch-action:none}#hold::before{content:"";position:absolute;inset:0;width:var(--h,0%);background:rgba(255,255,255,.3)}#hold span{position:relative}
#berr{color:#ff7a7a;font-size:15px;margin-top:10px;min-height:18px}
body.noanim #wt span{opacity:1!important;filter:none!important;transform:none!important}
#req{width:min(460px,100%)!important}
#np{position:fixed;left:20px;bottom:20px;z-index:60;display:flex;align-items:center;gap:14px;width:min(330px,calc(100vw - 40px));padding:12px 14px;border-radius:calc(var(--radius) + 6px);background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(24px);box-shadow:0 20px 60px rgba(0,0,0,.45),0 0 40px color-mix(in srgb,var(--accent) 25%,transparent);opacity:0;transform:translateY(30px) scale(.94);pointer-events:none;transition:opacity .9s var(--ease),transform .9s var(--ease)}
#np.on{opacity:1;transform:none;pointer-events:auto}
#np img{width:68px;height:68px;border-radius:calc(var(--radius) - 2px);object-fit:cover;flex:none;box-shadow:0 8px 24px rgba(0,0,0,.5);transform:scale(.6) rotate(-8deg);filter:blur(10px);transition:transform 1.1s var(--ease) .2s,filter 1.1s .2s}
#np.on img{transform:none;filter:none}
#np.on.play img{animation:bob 4s ease-in-out infinite 1.5s}
@keyframes bob{50%{transform:scale(1.05)}}
.nt{flex:1;min-width:0}
.nt b,.nt small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:0;transform:translateX(-12px);transition:all .8s var(--ease)}
.nt b{font-size:18px;transition-delay:.5s}.nt small{color:var(--mut);font-size:15px;transition-delay:.7s}
#np.on .nt b,#np.on .nt small{opacity:1;transform:none}
.pb{height:4px;border-radius:9px;background:var(--panel2);margin-top:10px;overflow:hidden}.pb i{display:block;height:100%;width:0;background:var(--accent);box-shadow:0 0 10px var(--accent)}
#mus{flex:none;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--panel2);cursor:pointer;font-size:18px;transition:transform .25s var(--ease)}#mus:hover{transform:scale(1.12)}
#gate{position:fixed;inset:0;z-index:70;display:none;place-items:center;background:var(--bg)}#gate.on{display:grid}
#gbtn{padding:18px 36px;border:1px solid var(--accent);border-radius:99px;background:color-mix(in srgb,var(--accent) 16%,transparent);color:#fff;font-size:20px;cursor:pointer;animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 30px color-mix(in srgb,var(--accent) 50%,transparent)}50%{box-shadow:0 0 70px var(--accent);transform:scale(1.04)}}
#mh{position:absolute;bottom:34px;left:0;right:0;text-align:center;color:var(--mut);font-size:15px;opacity:0;transition:opacity .5s;pointer-events:none}#mh.on{opacity:1}
.btn.ghost{background:var(--panel2);box-shadow:none;color:var(--text);border:1px solid var(--line)}
.chat{max-height:300px;overflow:auto;display:flex;flex-direction:column;gap:8px;padding:4px 2px;margin-top:8px}
.mg{max-width:85%;padding:9px 12px;border-radius:var(--radius);background:var(--panel2);align-self:flex-start;white-space:pre-wrap;word-break:break-word}
.mg.me{align-self:flex-end;background:color-mix(in srgb,var(--accent) 22%,transparent)}
.mg small{display:block;color:var(--mut);font-size:12px}
/* toast */
#toast{position:fixed;right:24px;bottom:24px;padding:12px 18px;border-radius:var(--radius);background:var(--panel);border:1px solid var(--accent);opacity:0;transform:translateY(14px);transition:all .4s var(--ease);pointer-events:none}
#toast.show{opacity:1;transform:none}
/* effects driven by toggles */
body.noanim *{transition:none!important;animation:none!important}
body.focusring :focus-visible{outline:3px solid var(--accent);outline-offset:2px}
body.compact nav button span.t{display:none}body.compact #app{grid-template-columns:72px 1fr}
@media(max-width:640px){#app{grid-template-columns:1fr}nav{flex-direction:row;overflow:auto;border-right:0;border-bottom:1px solid var(--line)}nav .sp,#ping{display:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}#wt span{opacity:1;filter:none;transform:none}}
</style>
</head>
<body>

<form id="login" class="glass hide">
  <h1>Вход</h1>
  <p>Введите пароль или ключ.</p>
  <input id="pw" class="field" type="password" placeholder="Пароль или ключ" autocomplete="current-password" autofocus>
  <div id="err"></div>
  <button class="btn" type="submit">Войти</button>
  <button class="btn ghost" type="button" id="getk">Получить ключ</button>
</form>

<div id="req" class="glass hide"><h1>Получить ключ</h1><div id="rq"></div></div>
<div id="bot" class="glass hide"><h1>Проверка</h1><p>Подтвердите, что вы не бот: нажмите кнопку и удерживайте.</p><button id="hold" type="button" class="btn"><span id="hl">Удерживайте</span></button><div id="berr"></div></div>
<div id="intro"><div class="blob b1"></div><div class="blob b2"></div><h1 id="wt">Добро пожаловать</h1><div id="ld"><div class="bar"><i id="pb"></i></div><small id="ls">Подготовка…</small></div><div id="mh">Нажмите в любое место, чтобы включить музыку</div></div>
<audio id="bgm" src="music.mp3" loop preload="auto"></audio><div id="np"><img src="cover.jpg" alt=""><div class="nt"><b>4runner</b><small>Brenn!</small><div class="pb"><i id="npb"></i></div></div><button id="mus" type="button" aria-label="Музыка">🔊</button></div>
<div id="gate"><button type="button" id="gbtn">Нажмите, чтобы начать</button></div>
<div id="app" class="glass hide">
  <nav id="nav"></nav>
  <main id="main"></main>
</div>
<div id="toast">Тема обновлена</div>

<script>
// Вставьте сюда свои Client ID (инструкция в ответе)
const GOOGLE_CLIENT_ID="",YANDEX_CLIENT_ID="";
const $=s=>document.querySelector(s);
const store={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
const S=Object.assign({mode:"dark",accent:"#ff6b5e",density:2,font:"SF Pro",radius:12,anim:true,focus:false,grid:true,compact:false,tab:"Themes"},store.get("settings",{}));
if(!S.name||S.name==="Denn")S.name="Никита Бирюков Юрьевич";
const save=()=>store.set("settings",S);
let D={};
const esc=t=>String(t??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const avt=(src,sz,name)=>src?`<div class="av" style="width:${sz}px;height:${sz}px;background:center/cover url('${src}')"></div>`:`<div class="av" style="width:${sz}px;height:${sz}px;font-size:${Math.round(sz/2.2)}px">${esc((name||"Н")[0]).toUpperCase()}</div>`;

/* ---- login ---- */
$("#login").addEventListener("submit",e=>{
  e.preventDefault();
  const v=$("#pw").value.trim();
  fetch("/api/login",{method:"POST",body:JSON.stringify({v})}).then(r=>r.ok?r.json():Promise.reject()).then(j=>{if(j.admin)ADM=v;else store.set("vid",j.vid);toBot()}).catch(bad)
  
});
function enter(){
  const l=$("#bot");l.style.transition="opacity .35s,transform .35s";l.style.opacity=0;l.style.transform="scale(.97)";
  setTimeout(()=>{l.classList.add("hide");$("#app").classList.remove("hide");render();startPing()},l.isConnected&&!S.anim?0:340);
}


/* ---- apply settings ---- */
function apply(){
  const d=document.documentElement,st=d.style;
  const dark=S.mode==="auto"?matchMedia("(prefers-color-scheme:dark)").matches:S.mode==="dark";
  d.dataset.theme=dark?"dark":"light";
  st.setProperty("--accent",S.accent);st.setProperty("--radius",S.radius+"px");
  st.setProperty("--pad",[18,14,10][S.density]+"px");
  st.setProperty("--font",`"${S.font}",-apple-system,"Segoe UI",system-ui,sans-serif`);
  document.body.classList.toggle("noanim",!S.anim);
  document.body.classList.toggle("focusring",S.focus);
  document.body.classList.toggle("compact",S.compact);
}
let tt;function toast(m="Тема обновлена"){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("show"),1600)}
function change(k,v,quiet){S[k]=v;save();apply();if(!quiet)toast()}

/* ---- views ---- */
const TABS=[["Profile","Профиль"],["Team","Команда",2],["Friends","Друзья"],["Chat","Чат"],["Alerts","Уведомления",3],["Security","Безопасность"],["Themes","Темы"],["Connections","Подключения",2],["Subscription","Подписка"],["Shortcuts","Горячие клавиши"],["Dev","Для разработчиков"]];
const COLORS=["#3b82f6","#22c55e","#facc15","#fb923c","#ef4444","#a855f7","#6366f1","#06b6d4","#ff6b5e"];
const FONTS=["SF Pro","Inter","Segoe UI","Georgia","Consolas"];

function render(){clearInterval(ct);clearInterval(rt);apply();
  $("#nav").innerHTML=TABS.filter(t=>t[0]!=="Chat"||ADM||store.get("vid",null)).map(([id,n,b])=>`<button data-t="${id}" class="${id===S.tab?"on":""}"><span class="t">${id==="Chat"&&ADM?"Заявки":n}</span>${b?`<span class="badge">${b}</span>`:""}</button>`).join("")+`<div class="sp"></div><button id="out"><span class="t">Выйти</span></button>`;
  $("#nav").onclick=e=>{const b=e.target.closest("button");if(!b)return;
    if(b.id==="out"){store.set("auth",false);location.reload();return}
    S.tab=b.dataset.t;D={};save();render();};
  $("#main").innerHTML=`<div class="view">${S.tab==="Themes"?themes():stub()}</div>`;
  if(S.tab==="Themes")bind();else bindTab();
}
const tgl=(k,t,sub)=>`<div class="row"><button class="tg ${S[k]?"on":""}" data-k="${k}" aria-label="${t}"></button><div><b>${t}</b><small>${sub}</small></div></div>`;
const head=(t,sub)=>`<h2>${t}</h2><p class="sub">${sub}</p>`;
const TEAM=[["Анна Ковалёва","Дизайнер",1],["Макс Орлов","Разработчик",1],["Лина Мейер","Менеджер",0],["Игорь Белов","Разработчик",1],["Софи Лоран","Аналитик",0]];
function stub(){
  const t=S.tab;
  if(t==="Profile"){const a=("avatar" in D)?D.avatar:S.avatar,nm=D.name??S.name;
    return head("Профиль","Ваши данные и фото.")+`<div class="pv" id="pvbox"><div id="pvbig">${avt(a,96,nm)}</div><div><b>Фото профиля</b><br><small>Любое изображение, оно обрежется до квадрата.</small><div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap"><button class="btn sm" id="up">Выбрать фото</button><button class="btn sm ghost" id="rm">Убрать</button></div><input type="file" id="fi" accept="image/*" hidden></div></div>
    <div class="lbl">Так вас увидят</div><div class="li" id="pvrow">${avt(a,34,nm)}<div><b id="pvn">${esc(nm)}</b><br><small>Разработчик</small></div><span class="dot ok"></span></div>
    <div class="lbl">Имя</div><input class="field" id="nm" value="${esc(nm)}">
    <div class="lbl">Почта</div><input class="field" id="em" placeholder="you@example.com" value="${esc(D.email??S.email)}">
    <div style="display:flex;gap:14px;align-items:center;margin-top:18px"><button class="btn sm" id="sv">Сохранить</button><small id="dirty" style="color:var(--mut)"></small></div>`}
  if(t==="Team"){const n=new Date();let ag=n.getFullYear()-2007;if(n<new Date(n.getFullYear(),9,2))ag--;

      const x={ms:Math.round(performance.now()-t0),o:Object.fromEntries(tx.trim().split("\n").map(l=>l.split("=")))};
      if(!best)best=x;if(x.o.warp&&x.o.warp!=="off")return x}catch{}
  }return best}

/* ---- заявки на ключ и чат ---- */
let ADM=null,rt,ct;
const rapi=async b=>{const r=await fetch("/api/req",{method:"POST",body:JSON.stringify(b)});if(!r.ok)throw 0;return r.json()};
const msgsHTML=(m,me,nb,nv)=>m.map(x=>`<div class="mg${x.f===me?" me":""}"><small>${x.f==="b"?nb:nv} ${new Date(x.ts).toLocaleTimeString("ru",{hour:"2-digit",minute:"2-digit"})}</small>${esc(x.t)}</div>`).join("");
function bad(){const l=$("#login");$("#err").textContent="Неверный пароль или ключ.";l.classList.remove("shake");void l.offsetWidth;l.classList.add("shake");$("#pw").select()}
$("#getk").onclick=()=>{location.href="dash.html"};
function reqView(el,back){
  clearInterval(rt);const q=s=>el.querySelector(s),vid=store.get("vid",null);
  const bk=back?'<button class="btn ghost" id="rbk">Назад</button>':"";
  if(!vid){
    el.innerHTML='<p class="sub">Введите имя, чтобы вам выдали ключ.</p><input class="field" id="rn" placeholder="Ваше имя" maxlength="40"><button class="btn" id="rgo">Получить ключ</button>'+bk;
    q("#rgo").onclick=async()=>{try{const r=await rapi({name:q("#rn").value.trim()||"Гость"});store.set("vid",r.vid);reqView(el,back)}catch{toast("Сервер недоступен")}};
  }else{
    el.innerHTML='<span id="rst" class="chip" style="background:var(--accent)">Ожидайте выдачи ключа</span><p class="sub" style="margin:8px 0">Обычно от 10 минут до часа. Страницу можно не закрывать.</p><div class="chat" id="rch"></div><div style="display:flex;gap:8px;margin-top:10px"><input class="field" id="rtx" placeholder="Сообщение"><button class="btn sm" id="rsd">Отправить</button></div>'+bk;
    const pull=async t=>{try{const r=await rapi({vid,text:t});if(r.gone){store.set("vid",null);clearInterval(rt);toast("Заявка удалена");return reqView(el,back)}const c=q("#rch"),low=c.scrollTop+c.clientHeight>=c.scrollHeight-30;c.innerHTML=msgsHTML(r.msgs,"v","Бот","Вы");if(low||t)c.scrollTop=c.scrollHeight;q("#rst").textContent=r.status==="ok"?"Ключ выдан":r.status==="no"?"Заявка отклонена":"Ожидайте выдачи ключа"}catch{}};
    pull();rt=setInterval(pull,5000);
    q("#rsd").onclick=()=>{const i=q("#rtx"),t=i.value.trim();if(t){i.value="";pull(t)}};
    q("#rtx").onkeydown=e=>{if(e.key==="Enter")q("#rsd").click()};
  }
  if(back)q("#rbk").onclick=()=>{clearInterval(rt);$("#req").classList.add("hide");$("#login").classList.remove("hide")};
}
async function admTab(){
  const el=$("#ch");let cur=null;const q=s=>el.querySelector(s);
  const adm=async b=>{const r=await fetch("/api/adm",{method:"POST",body:JSON.stringify({pw:ADM,...b})});if(!r.ok)throw 0;return r.json()};
  const stT=s=>s==="ok"?"Ключ выдан":s==="no"?"Отклонена":"Ждёт";
  const list=async()=>{try{const{list:l}=await adm({act:"list"});
    el.innerHTML=l.length?l.map(x=>`<div class="li" data-v="${x.vid}" style="cursor:pointer"><div class="av">${esc((x.name||"?")[0]).toUpperCase()}</div><div><b>${esc(x.name)}</b>${x.unread?` <span class="chip" style="background:var(--accent)">${x.unread}</span>`:""}<br><small>${esc(x.pre.slice(0,60))}</small></div><span class="chip ${x.status==="ok"?"ok":x.status==="no"?"off":""}" style="margin-left:auto">${stT(x.status)}</span></div>`).join(""):'<small style="color:var(--mut)">Заявок пока нет.</small>';
    el.querySelectorAll(".li").forEach(d=>d.onclick=()=>{cur=d.dataset.v;view()})}catch{el.innerHTML="<small>Сервер недоступен или не задан ADMIN_PASS.</small>"}};
  const view=async(act,text)=>{try{
    const r=await adm({act:act||"get",vid:cur,text});
    if(r.gone){cur=null;toast("Удалено");return list()}
    if(!q("#ac")){
      el.innerHTML='<button class="btn sm ghost" id="ab">← К заявкам</button> <b id="an"></b><div class="chat" id="ac"></div><div style="display:flex;gap:8px;margin-top:10px"><input class="field" id="at" placeholder="Сообщение от имени бота"><button class="btn sm" id="as">Отправить</button></div><div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap"><button class="btn sm" id="aok">Одобрить и выдать ключ</button><button class="btn sm ghost" id="ano">Отклонить</button><button class="btn sm ghost" id="adl" style="margin-left:auto;color:#ff7a7a">Удалить переписку</button></div>';
      const t=()=>{const i=q("#at"),v=i.value.trim();i.value="";return v};
      q("#ab").onclick=()=>{cur=null;list()};
      q("#as").onclick=()=>{const v=t();if(v)view("send",v)};
      q("#at").onkeydown=e=>{if(e.key==="Enter")q("#as").click()};
      q("#aok").onclick=()=>view("ok",t());
      q("#ano").onclick=()=>view("no",t());
      q("#adl").onclick=()=>{if(confirm("Удалить заявку и переписку? У человека она тоже исчезнет."))view("del")};
    }
    q("#an").textContent=r.name+" · "+stT(r.status);
    const c=q("#ac"),low=c.scrollTop+c.clientHeight>=c.scrollHeight-30;
    c.innerHTML=msgsHTML(r.msgs,"b","Вы (бот)",esc(r.name));if(low||act)c.scrollTop=c.scrollHeight;
  }catch{}};
  list();ct=setInterval(()=>cur?view():list(),6000);
}

/* ---- музыка ---- */
const bgm=$("#bgm");let muted=store.get("muted",false);bgm.volume=0;
const mic=()=>{$("#mus").textContent=muted?"🔇":"🔊"};mic();
function fade(to,ms=1800,end){const f=bgm.volume,t0=performance.now();const st=()=>{const p=Math.min(1,(performance.now()-t0)/ms);bgm.volume=Math.max(0,Math.min(1,f+(to-f)*p));if(p<1)requestAnimationFrame(st);else end&&end()};st()}
async function play(){if(muted)return true;try{await bgm.play();fade(.45);$("#np").classList.add("play");return true}catch{return false}}
async function music(){
  if(!muted&&!await play()){
    $("#gate").classList.add("on");
    await new Promise(r=>$("#gbtn").onclick=r);
    $("#gate").classList.remove("on");
    await play();
  }
  setTimeout(()=>$("#np").classList.add("on"),500);
}
bgm.addEventListener("timeupdate",()=>{if(bgm.duration)$("#npb").style.width=bgm.currentTime/bgm.duration*100+"%"});
$("#mus").onclick=()=>{muted=!muted;store.set("muted",muted);mic();$("#np").classList.toggle("play",!muted);if(muted)fade(0,500,()=>bgm.pause());else play()};
apply();boot();
</script>
</body>
</html>
