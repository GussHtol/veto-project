<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Плейлист</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #1e293b;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 3px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #475569;
        }
    </style>
</head>
<body class="h-screen flex flex-col justify-between p-4 md:p-8">

    <!-- Header / Navigation -->
    <header class="flex justify-between items-center pb-6 border-b border-slate-800">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 rounded-full bg-indigo-600 flex items-center justify-center text-xl font-bold">
                <i class="fa-solid fa-music"></i>
            </div>
            <h1 class="text-xl font-bold tracking-wide">Мой Плейлист</h1>
        </div>
        <span class="text-sm text-slate-400">3 Трека</span>
    </header>

    <!-- Main Content Area -->
    <main class="flex-1 my-6 overflow-hidden flex flex-col max-w-2xl mx-auto w-full">
        <div class="bg-slate-900/60 backdrop-blur border border-slate-800 rounded-2xl p-4 md:p-6 flex-1 flex flex-col justify-between shadow-xl">
            
            <!-- Tracks Container -->
            <div class="space-y-3 overflow-y-auto custom-scrollbar pr-2 flex-1">
                
                <!-- Track 1 -->
                <div class="flex items-center justify-between p-3 rounded-xl bg-slate-800/50 hover:bg-slate-800 border border-slate-700/50 transition-all cursor-pointer group">
                    <div class="flex items-center space-x-4">
                        <div class="w-12 h-12 rounded-lg bg-indigo-950 flex items-center justify-center text-indigo-400 group-hover:scale-105 transition-transform">
                            <i class="fa-solid fa-compact-disc text-xl"></i>
                        </div>
                        <div>
                            <h3 class="font-semibold text-slate-100 group-hover:text-indigo-400 transition-colors">4runner</h3>
                            <p class="text-sm text-slate-400">Brenn!</p>
                        </div>
                    </div>
                    <button class="w-10 h-10 rounded-full flex items-center justify-center text-slate-400 hover:text-white hover:bg-slate-700/50 transition-colors">
                        <i class="fa-solid fa-play"></i>
                    </button>
                </div>

                <!-- Track 2 -->
                <div class="flex items-center justify-between p-3 rounded-xl bg-slate-800/50 hover:bg-slate-800 border border-slate-700/50 transition-all cursor-pointer group">
                    <div class="flex items-center space-x-4">
                        <div class="w-12 h-12 rounded-lg bg-purple-950 flex items-center justify-center text-purple-400 group-hover:scale-105 transition-transform">
                            <i class="fa-solid fa-compact-disc text-xl"></i>
                        </div>
                        <div>
                            <h3 class="font-semibold text-slate-100 group-hover:text-purple-400 transition-colors">Нежная</h3>
                            <p class="text-sm text-slate-400">Диана Гурцкая</p>
                        </div>
                    </div>
                    <button class="w-10 h-10 rounded-full flex items-center justify-center text-slate-400 hover:text-white hover:bg-slate-700/50 transition-colors">
                        <i class="fa-solid fa-play"></i>
                    </button>
                </div>

                <!-- Track 3 -->
                <div class="flex items-center justify-between p-3 rounded-xl bg-slate-800/50 hover:bg-slate-800 border border-slate-700/50 transition-all cursor-pointer group">
                    <div class="flex items-center space-x-4">
                        <div class="w-12 h-12 rounded-lg bg-pink-950 flex items-center justify-center text-pink-400 group-hover:scale-105 transition-transform">
                            <i class="fa-solid fa-compact-disc text-xl"></i>
                        </div>
                        <div>
                            <h3 class="font-semibold text-slate-100 group-hover:text-pink-400 transition-colors">снов осколки</h3>
                            <p class="text-sm text-slate-400">nicebeatzprod</p>
                        </div>
                    </div>
                    <button class="w-10 h-10 rounded-full flex items-center justify-center text-slate-400 hover:text-white hover:bg-slate-700/50 transition-colors">
                        <i class="fa-solid fa-play"></i>
                    </button>
                </div>

            </div>

            <!-- Mini Player Bar -->
            <div class="mt-6 pt-4 border-t border-slate-800 flex items-center justify-between">
                <div class="flex items-center space-x-3">
                    <div class="w-10 h-10 rounded-lg bg-indigo-600 flex items-center justify-center text-white">
                        <i class="fa-solid fa-music"></i>
                    </div>
                    <div>
                        <p class="text-xs text-slate-400">Сейчас играет</p>
                        <p class="text-sm font-medium text-slate-200">4runner — Brenn!</p>
                    </div>
                </div>
                <div class="flex items-center space-x-2">
                    <button class="p-2 text-slate-400 hover:text-white transition-colors"><i class="fa-solid fa-backward-step"></i></button>
                    <button class="w-8 h-8 rounded-full bg-white text-slate-900 flex items-center justify-center hover:bg-slate-200 transition-colors"><i class="fa-solid fa-pause text-xs"></i></button>
                    <button class="p-2 text-slate-400 hover:text-white transition-colors"><i class="fa-solid fa-forward-step"></i></button>
                </div>
            </div>

        </div>
    </main>

</body>
</html>
