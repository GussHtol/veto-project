<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Кабинет</title>
<style>
:root{--a:#ff6b5e;--p:rgba(24,27,36,.62);--l:rgba(255,255,255,.1);--t:#eef0f5;--m:#8b91a0;--e:cubic-bezier(.3,.8,.3,1);--r:18px}
*{box-sizing:border-box;margin:0}
body{font:16px/1.4 -apple-system,"SF Pro Display","Segoe UI",system-ui,sans-serif;color:var(--t);background:#06070a;min-height:100vh;overflow-x:hidden}
button,input,textarea{font:inherit;color:inherit}.hide{display:none!important}
.bg{position:fixed;inset:0;z-index:-1;background:radial-gradient(60% 50% at 75% 0,rgba(255,107,94,.2),transparent),radial-gradient(50% 50% at 10% 90%,rgba(80,100,255,.12),transparent),linear-gradient(#0b0d13,#05060a)}
.bg svg{position:absolute;bottom:0;width:100%;height:50%}
.g{background:var(--p);border:1px solid var(--l);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-radius:var(--r);box-shadow:0 20px 60px rgba(0,0,0,.4)}
.s{color:var(--m);font-size:15px}
.b{display:block;width:100%;padding:13px;border:0;border-radius:12px;background:var(--a);color:#fff;font-weight:600;cursor:pointer;text-align:center;text-decoration:none;box-shadow:0 8px 26px rgba(255,107,94,.4);transition:transform .2s var(--e),filter .2s}
.b:hover{filter:brightness(1.1);transform:translateY(-1px)}.b:active{transform:scale(.97)}
.b.sm{width:auto;padding:10px 16px}.b.ghost{background:rgba(255,255,255,.07);box-shadow:none;border:1px solid var(--l);margin-top:10px}
input,textarea{width:100%;padding:12px 14px;border-radius:12px;background:rgba(255,255,255,.06);border:1px solid var(--l);outline:0;transition:border-color .25s,box-shadow .25s}
input:focus,textarea:focus{border-color:var(--a);box-shadow:0 0 0 3px rgba(255,107,94,.25)}
/* auth */
#auth{min-height:100vh;display:grid;place-items:center;padding:20px}
.card{width:min(780px,100%);min-height:440px;display:grid;grid-template-columns:1fr 1fr;overflow:hidden;animation:up .8s var(--e) both}
.card form{padding:36px 34px;display:flex;flex-direction:column;gap:8px;justify-content:center}
.card h1{font-size:30px}.card label{font-size:14px;margin-top:10px}
#cv{width:100%;height:100%;min-height:300px;-webkit-mask-image:linear-gradient(90deg,transparent,#000 35%);mask-image:linear-gradient(90deg,transparent,#000 35%)}
#ae{color:#ff7a7a;font-size:14px;min-height:18px}
#sw{color:var(--t);cursor:pointer;text-decoration:underline}
#af .b{margin-top:6px}
@media(max-width:700px){.card{grid-template-columns:1fr}#cv{display:none}}
@keyframes up{from{opacity:0;transform:translateY(24px) scale(.98)}}
.sh{animation:sh .4s}@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
/* app */
#app{padding:20px 20px 40px 96px}
.side{position:fixed;left:18px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:10px;padding:10px;z-index:5}
.ib{width:44px;height:44px;border-radius:14px;border:1px solid transparent;background:0;cursor:pointer;font-size:19px;color:var(--m);transition:all .25s var(--e)}
.ib:hover,.ib.on{color:#fff;background:rgba(255,107,94,.15);border-color:var(--a);box-shadow:0 0 18px rgba(255,107,94,.4)}
header{display:flex;justify-content:space-between;max-width:1100px;margin:0 auto;animation:up .7s var(--e) both}
.pill{padding:12px 20px;font-size:16px}
.hero{text-align:center;margin:34px auto 10px;max-width:640px;animation:up .8s var(--e) .1s both}
#clk{font-size:clamp(64px,12vw,120px);font-weight:300;letter-spacing:-.03em;line-height:1;text-shadow:0 0 40px rgba(255,107,94,.35)}
#dt{color:var(--m);margin:10px 0 26px;text-transform:capitalize}
.hero input{padding:16px 20px;border-radius:99px;font-size:17px;background:var(--p)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px;max-width:1100px;margin:30px auto 0}
.w{padding:20px;animation:up .8s var(--e) both;transition:transform .3s var(--e),border-color .3s}
.w:hover{transform:translateY(-3px);border-color:rgba(255,107,94,.45)}
.w:nth-child(1){animation-delay:.2s}.w:nth-child(2){animation-delay:.3s}.w:nth-child(3){animation-delay:.4s}.w:nth-child(4){animation-delay:.5s}.w:nth-child(5){animation-delay:.6s}.w:nth-child(6){animation-delay:.7s}
.w h3{display:flex;align-items:center;gap:10px;font-size:17px;margin-bottom:14px}
.w h3 button{margin-left:auto;width:28px;height:28px;border-radius:8px;border:1px solid var(--l);background:0;cursor:pointer;font-size:18px}
.chip{font-size:13px;padding:3px 10px;border-radius:99px;background:var(--a);color:#fff;font-weight:600;margin-left:auto}
.li{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;color:inherit;text-decoration:none;transition:background .2s,transform .2s var(--e)}
.li:hover{background:rgba(255,255,255,.07);transform:translateX(3px)}
.li i{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-style:normal;font-weight:700;background:var(--a);flex:none}
.li small{color:var(--m);margin-left:auto}.li .x{margin-left:8px;opacity:0;cursor:pointer;background:0;border:0}.li:hover .x{opacity:.7}
.td{cursor:pointer}.td.d span{text-decoration:line-through;color:var(--m)}
.td u{width:18px;height:18px;border-radius:50%;border:2px solid var(--m);flex:none;text-decoration:none;display:grid;place-items:center;font-size:11px}
.td.d u{background:var(--a);border-color:var(--a)}
#nt{height:150px;resize:none}
.chat{max-height:210px;overflow:auto;display:flex;flex-direction:column;gap:8px;margin:10px 0}
.mg{max-width:88%;padding:9px 12px;border-radius:14px;background:rgba(255,255,255,.07);align-self:flex-start;white-space:pre-wrap;word-break:break-word}
.mg.me{align-self:flex-end;background:rgba(255,107,94,.25)}.mg small{display:block;color:var(--m);font-size:12px}
.row{display:flex;gap:8px}
.pl{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px}
.pl img{width:150px;height:150px;border-radius:18px;object-fit:cover;box-shadow:0 14px 40px rgba(0,0,0,.6),0 0 40px rgba(255,107,94,.25)}
.pl.on img{animation:bob 4s ease-in-out infinite}@keyframes bob{50%{transform:scale(1.04)}}
.pr{width:100%;height:4px;border-radius:9px;background:rgba(255,255,255,.1);overflow:hidden}.pr i{display:block;height:100%;width:0;background:var(--a)}
#pp{width:52px;height:52px;border-radius:50%;border:0;background:var(--a);cursor:pointer;font-size:20px;box-shadow:0 0 24px rgba(255,107,94,.5)}
.qt{display:flex;flex-direction:column;justify-content:center}.qt p{font-size:19px;line-height:1.5}
@media(max-width:760px){#app{padding:16px 14px 90px}.side{top:auto;bottom:12px;left:50%;transform:translateX(-50%);flex-direction:row}}
</style>
</head>
<body>
<div class="bg"><svg viewBox="0 0 100 40" preserveAspectRatio="none"><polygon fill="#10131b" points="0,40 0,22 12,12 22,20 34,6 48,22 60,10 74,24 88,14 100,22 100,40"/><polygon fill="#0a0c12" points="0,40 0,30 16,20 30,28 46,16 62,30 80,20 100,30 100,40"/></svg></div>

<div id="auth" class="hide"><div class="g card">
  <form id="af"><h1 id="at">Войти</h1><p class="s" id="as">Введите данные, чтобы войти в аккаунт.</p>
    <label>Логин</label><input id="lg" autocomplete="username" maxlength="24">
    <label>Пароль</label><input id="pw" type="password" autocomplete="current-password">
    <div id="ae"></div><button class="b" id="ab">Войти</button>
    <p class="s" style="margin-top:14px"><span id="sq">Нет аккаунта?</span> <a id="sw">Зарегистрироваться</a></p>
  </form><canvas id="cv"></canvas></div></div>

<div id="app" class="hide">
  <nav class="g side"><button class="ib on" title="Главная">⌂</button><button class="ib" id="gk" title="Ключ">⚿</button><button class="ib" id="out" title="Выйти">⏻</button></nav>
  <header><div class="g pill" id="hi"></div><div class="g pill" id="usr"></div></header>
  <section class="hero"><div id="clk"></div><div id="dt"></div><input id="q" placeholder="Поиск в Google или адрес сайта"></section>
  <main class="grid">
    <div class="g w"><h3>Закладки <button id="ba" title="Добавить">+</button></h3><div id="bl"></div></div>
    <div class="g w" id="wk"></div>
    <div class="g w"><h3>Задачи</h3><div id="tl"></div><input id="ti" placeholder="Новая задача, Enter" style="margin-top:10px"></div>
    <div class="g w pl" id="pc"><img src="cover.jpg" alt=""><b>4runner</b><span class="s">Brenn!</span><div class="pr"><i id="pg"></i></div><button id="pp">▶</button></div>
    <div class="g w"><h3>Заметки</h3><textarea id="nt" placeholder="Пишите что угодно, сохраняется само"></textarea></div>
    <div class="g w qt"><p id="qp"></p><span class="s" style="margin-top:10px">Фокус на прогрессе, а не на идеале.</span></div>
  </main>
  <audio id="au" src="music.mp3" loop></audio>
</div>

<script>
const $=i=>document.getElementById(i),esc=t=>String(t??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let TK=localStorage.getItem("tk"),D={b:[["YouTube","youtube.com"],["GitHub","github.com"],["Gmail","mail.google.com"],["Discord","discord.com"],["Яндекс Музыка","music.yandex.ru"]],t:[],n:""},mode="log",ks="",tm,st;
async function api(p,b){const r=await fetch("/api/"+p,{method:"POST",body:JSON.stringify(b)});let j={};try{j=await r.json()}catch{}if(!r.ok)throw j;return j}
const out=()=>{localStorage.removeItem("tk");location.reload()};
function save(){clearTimeout(st);st=setTimeout(()=>api("save",{token:TK,data:D}).catch(e=>e.err==="auth"&&out()),700)}

/* ---- вход / регистрация + точечный кот ---- */
const cv=$("cv"),cx=cv.getContext("2d");let W,H,mk,mx=-999,my=-999;
function sz(){W=cv.width=cv.clientWidth;H=cv.height=cv.clientHeight;if(!W)return;const o=document.createElement("canvas");o.width=W;o.height=H;const c=o.getContext("2d"),s=Math.min(W,H)*.34,X=W/2,Y=H/2+s*.1;
  c.fillStyle="#fff";c.beginPath();c.ellipse(X,Y,s,s*.85,0,0,7);c.fill();
  [-1,1].forEach(d=>{c.beginPath();c.moveTo(X+d*s*.95,Y-s*.2);c.lineTo(X+d*s*.75,Y-s*1.15);c.lineTo(X+d*s*.2,Y-s*.78);c.fill()});
  c.globalCompositeOperation="destination-out";
  [-1,1].forEach(d=>{c.beginPath();c.ellipse(X+d*s*.42,Y-s*.05,s*.14,s*.2,0,0,7);c.fill()});
  c.beginPath();c.moveTo(X-s*.12,Y+s*.28);c.lineTo(X+s*.12,Y+s*.28);c.lineTo(X,Y+s*.42);c.fill();
  mk=c.getImageData(0,0,W,H).data}
function draw(t){if($("auth").classList.contains("hide"))return;cx.clearRect(0,0,W,H);cx.fillStyle="#fff";const k=8;
  for(let y=k/2;y<H;y+=k)for(let x=k/2;x<W;x+=k){const a=mk[((y|0)*W+(x|0))*4+3]/255,w=.5+.5*Math.sin(t/700+x*.04+y*.03);let r=a?k*.46*(.4+.6*w):k*.07;const d=Math.hypot(x-mx,y-my);if(d<70)r*=1+(70-d)/70;cx.globalAlpha=a?.9:.22;cx.beginPath();cx.arc(x,y,r,0,7);cx.fill()}
  requestAnimationFrame(draw)}
cv.onmousemove=e=>{const r=cv.getBoundingClientRect();mx=e.clientX-r.left;my=e.clientY-r.top};cv.onmouseleave=()=>mx=-999;
addEventListener("resize",()=>{if(!$("auth").classList.contains("hide"))sz()});
function showAuth(){$("auth").classList.remove("hide");sz();requestAnimationFrame(draw);$("lg").focus()}
$("sw").onclick=()=>{mode=mode==="log"?"reg":"log";const r=mode==="reg";$("at").textContent=r?"Регистрация":"Войти";$("as").textContent=r?"Придумайте логин и пароль для нового аккаунта.":"Введите данные, чтобы войти в аккаунт.";$("ab").textContent=r?"Создать аккаунт":"Войти";$("sq").textContent=r?"Уже есть аккаунт?":"Нет аккаунта?";$("sw").textContent=r?"Войти":"Зарегистрироваться";$("ae").textContent="";$("pw").autocomplete=r?"new-password":"current-password"};
$("af").onsubmit=async e=>{e.preventDefault();$("ae").textContent="";
  try{const r=await api(mode,{login:$("lg").value,pass:$("pw").value});TK=r.token;localStorage.setItem("tk",TK);Object.assign(D,r.data);$("auth").style.transition="opacity .4s";$("auth").style.opacity=0;setTimeout(()=>{$("auth").classList.add("hide");start(r.login)},400)}
  catch(x){$("ae").textContent=x.err||"Сервер недоступен";const c=document.querySelector(".card");c.classList.remove("sh");void c.offsetWidth;c.classList.add("sh")}};

/* ---- кабинет ---- */
function start(l){
  $("app").classList.remove("hide");const h=new Date().getHours();
  $("hi").textContent=(h<5?"Доброй ночи":h<12?"Доброе утро":h<18?"Добрый день":"Добрый вечер")+", "+l;
  $("usr").textContent="@"+l;$("nt").value=D.n||"";
  $("qp").textContent="«Лучший способ предсказать будущее — создать его.»";
  tick();setInterval(tick,1000);bm();td();key();setInterval(()=>key(),5000);
  const au=$("au");au.volume=.45;au.play().catch(()=>{});
}
function tick(){const d=new Date();$("clk").textContent=d.toLocaleTimeString("ru",{hour:"2-digit",minute:"2-digit"});$("dt").textContent=d.toLocaleDateString("ru",{weekday:"long",day:"numeric",month:"long"})}
$("q").onkeydown=e=>{if(e.key!=="Enter")return;const v=e.target.value.trim();if(!v)return;open(/^[\w-]+(\.[\w-]+)+(\/\S*)?$/.test(v)?"https://"+v:"https://www.google.com/search?q="+encodeURIComponent(v),"_blank")};
function bm(){$("bl").innerHTML=D.b.map((x,i)=>`<a class="li" href="https://${esc(x[1])}" target="_blank" rel="noopener"><i>${esc(x[0][0]).toUpperCase()}</i>${esc(x[0])}<small>${esc(x[1])}</small><button class="x" data-i="${i}">✕</button></a>`).join("")||'<span class="s">Пока пусто</span>'}
$("bl").onclick=e=>{const b=e.target.closest(".x");if(!b)return;e.preventDefault();D.b.splice(+b.dataset.i,1);bm();save()};
$("ba").onclick=()=>{const n=prompt("Название");if(!n)return;let u=prompt("Адрес сайта, например site.com");if(!u)return;D.b.push([n.slice(0,30),u.replace(/^https?:\/\//,"").slice(0,60)]);bm();save()};
function td(){$("tl").innerHTML=D.t.map((x,i)=>`<div class="li td${x.d?" d":""}" data-i="${i}"><u>${x.d?"✓":""}</u><span>${esc(x.x)}</span><button class="x" data-r="${i}">✕</button></div>`).join("")||'<span class="s">Задач нет</span>'}
$("tl").onclick=e=>{const r=e.target.closest("[data-r]");if(r){D.t.splice(+r.dataset.r,1)}else{const t=e.target.closest(".td");if(!t)return;D.t[+t.dataset.i].d=!D.t[+t.dataset.i].d}td();save()};
$("ti").onkeydown=e=>{if(e.key==="Enter"&&e.target.value.trim()){D.t.push({x:e.target.value.trim().slice(0,100),d:0});e.target.value="";td();save()}};
$("nt").oninput=e=>{D.n=e.target.value.slice(0,5000);save()};
$("out").onclick=out;$("gk").onclick=()=>$("wk").scrollIntoView({behavior:"smooth",block:"center"});

/* ---- ключ и чат с ботом ---- */
async function key(t,go){
  const el=$("wk");let r;try{r=await api("req",{token:TK,text:t,start:go})}catch(e){if(e.err==="auth")out();return}
  if(r.none){ks="";el.innerHTML='<h3>Ключ доступа</h3><p class="s" style="margin-bottom:16px">Подайте заявку, и бот выдаст вам ключ. Ожидание обычно от 10 минут до часа.</p><button class="b" id="kg">Получить ключ</button>';$("kg").onclick=()=>key(0,1);return}
  if(ks!=="c"){ks="c";el.innerHTML='<h3>Ключ доступа <span class="chip" id="kst"></span></h3><p class="s" id="khn"></p><div class="chat" id="kc"></div><div class="row"><input id="kx" placeholder="Сообщение боту"><button class="b sm" id="ks">→</button></div><a class="b ghost hide" id="ko" href="/">Открыть приложение</a>';
    $("ks").onclick=()=>{const v=$("kx").value.trim();if(v){$("kx").value="";key(v)}};$("kx").onkeydown=e=>e.key==="Enter"&&$("ks").click()}
  const c=$("kc"),low=c.scrollTop+c.clientHeight>=c.scrollHeight-30;
  c.innerHTML=r.msgs.map(m=>`<div class="mg${m.f==="v"?" me":""}"><small>${m.f==="b"?"Бот":"Вы"} ${new Date(m.ts).toLocaleTimeString("ru",{hour:"2-digit",minute:"2-digit"})}</small>${esc(m.t)}</div>`).join("");
  if(low||t)c.scrollTop=c.scrollHeight;
  $("kst").textContent=r.status==="ok"?"Ключ выдан":r.status==="no"?"Отклонена":"Ожидание";
  $("khn").textContent=r.status==="wait"?"Ожидайте выдачи ключа: обычно от 10 минут до часа.":r.status==="ok"?"Скопируйте ключ из сообщения и вставьте на странице входа.":"Заявка отклонена.";
  $("ko").classList.toggle("hide",r.status!=="ok");
}

/* ---- плеер ---- */
const au=$("au");
$("pp").onclick=()=>au.paused?au.play():au.pause();
au.onplay=()=>{$("pp").textContent="❚❚";$("pc").classList.add("on")};au.onpause=()=>{$("pp").textContent="▶";$("pc").classList.remove("on")};
au.ontimeupdate=()=>{if(au.duration)$("pg").style.width=au.currentTime/au.duration*100+"%"};

/* ---- старт ---- */
if(TK)api("me",{token:TK}).then(r=>{Object.assign(D,r.data);start(r.login)}).catch(()=>{localStorage.removeItem("tk");TK=null;showAuth()});else showAuth();
</script>
</body>
</html>
